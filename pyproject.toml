[project]
name = "minimax-music-3"
version = "0.1.0"
description = "Local MiniMax Music 3 studio and command-line tools"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "soundfile>=0.14.0",
    "click>=8.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
inference = [
    "accelerate>=1.15.0",
    "diffusers",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "rust-just>=1.58.0",
]

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers", rev = "82319140e0456fd58beff0a251c38825bfc310de" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
music3 = "music3.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/music3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
